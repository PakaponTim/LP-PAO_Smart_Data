name: Water_System2 Cloud Collector (Every 30 Minutes)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-lampang-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, json, openssl
          coverage: none

      - name: Run PHP Direct API Collector (Water, Rain, Dam, PM2.5, Traffy)
        run: |
          php php_server/github_collect_snapshot.php

      - name: Ping Live Server cron.php & Evaluate Failover Status
        id: ping_server
        continue-on-error: true
        env:
          WATER_SERVER_CRON_URL: ${{ secrets.WATER_SERVER_CRON_URL }}
        run: |
          if [ -n "$WATER_SERVER_CRON_URL" ]; then
            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --retry 2 --max-time 25 "$WATER_SERVER_CRON_URL" || echo "000")
            echo "Server ping HTTP code: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "server_status=ok" >> "$GITHUB_OUTPUT"
            else
              echo "server_status=down" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "WATER_SERVER_CRON_URL secret is not set; skipping live server ping."
            echo "server_status=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Cloud Failover Alert (When Primary Server is Unreachable)
        continue-on-error: true
        env:
          SERVER_STATUS: ${{ steps.ping_server.outputs.server_status }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          php php_server/github_failover_alert.php --server-status="${SERVER_STATUS:-skipped}"

      - name: Save & Commit Snapshot to GitHub Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud_snapshots/
          if git diff --staged --quiet; then
            echo "No new snapshot files to commit."
          else
            TIMESTAMP=$(TZ='Asia/Bangkok' date +'%Y-%m-%d %H:%M:%S')
            git commit -m "chore(snapshot): auto-collect Lampang data at ${TIMESTAMP} ICT"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          fi
