name: LP-PAO Smart Data Cloud Collector (Every 30 Minutes)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: lp-pao-smart-data-collector
  cancel-in-progress: false

jobs:
  collect-lampang-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, json, openssl
          coverage: none

      - name: Run PHP Direct API Collector (Water, Rain, Dam, PM2.5, Traffy)
        run: |
          php php_server/github_collect_snapshot.php

      - name: Ping Primary & Backup Domains (from domain_config.json / Secrets)
        id: ping_server
        continue-on-error: true
        env:
          WATER_SERVER_CRON_URL: ${{ secrets.WATER_SERVER_CRON_URL }}
          WATER_SERVER_BACKUP_CRON_URL: ${{ secrets.WATER_SERVER_BACKUP_CRON_URL }}
          WATER_CRON_SECRET: ${{ secrets.WATER_CRON_SECRET }}
        run: |
          php php_server/github_ping_servers.php

      - name: Cloud Failover Alert (When Primary Server is Unreachable)
        continue-on-error: true
        env:
          SERVER_STATUS: ${{ steps.ping_server.outputs.server_status }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          php php_server/github_failover_alert.php --server-status="${SERVER_STATUS:-skipped}"

      - name: Record 3-Day Collector Run History (Auto-Prune > 3 Days)
        if: always()
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          SERVER_STATUS: ${{ steps.ping_server.outputs.server_status }}
        run: |
          php -r '
            date_default_timezone_set("Asia/Bangkok");
            $file = "cloud_snapshots/collector_runs_3d.json";
            if (!is_dir("cloud_snapshots")) mkdir("cloud_snapshots", 0755, true);
            $data = file_exists($file) ? json_decode(file_get_contents($file), true) : [];
            $runs = is_array($data["runs"] ?? null) ? $data["runs"] : [];
            $now = time();
            $cutoff = $now - (3 * 86400);
            $runs = array_values(array_filter($runs, function ($r) use ($cutoff) {
              return (int)($r["timestamp_unix"] ?? 0) >= $cutoff;
            }));
            array_unshift($runs, [
              "run_id" => getenv("RUN_ID"),
              "run_number" => (int)getenv("RUN_NUMBER"),
              "event" => getenv("EVENT_NAME"),
              "timestamp_unix" => $now,
              "timestamp_ict" => date("Y-m-d H:i:s"),
              "server_status" => getenv("SERVER_STATUS") ?: "unknown",
            ]);
            $payload = [
              "retention_days" => 3,
              "updated_at_ict" => date("Y-m-d H:i:s"),
              "total_runs_3d" => count($runs),
              "runs" => $runs,
            ];
            file_put_contents($file, json_encode($payload, JSON_UNESCAPED_UNICODE | JSON_PRETTY_PRINT) . "\n");
            echo "Saved 3-day collector history (" . count($runs) . " runs within 72h).\n";
          '

      - name: Save & Commit Snapshot to GitHub Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud_snapshots/
          if git diff --staged --quiet; then
            echo "No new snapshot files to commit."
          else
            TIMESTAMP=$(TZ='Asia/Bangkok' date +'%Y-%m-%d %H:%M:%S')
            git commit -m "chore(snapshot): auto-collect Lampang data at ${TIMESTAMP} ICT"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          fi

      - name: Cleanup Old Workflow Runs (Keep Latest 1 Only)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_RUN_IDS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/collect_every_30min.yml/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .status == \"completed\") | .id")
          DELETED=0
          for RUN_ID in $OLD_RUN_IDS; do
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" >/dev/null 2>&1; then
              DELETED=$((DELETED + 1))
            fi
          done
          echo "Cleaned up ${DELETED} old workflow run(s). Kept only latest run #${GITHUB_RUN_NUMBER} (ID: ${GITHUB_RUN_ID}); 3-day audit log stored in cloud_snapshots/collector_runs_3d.json."
