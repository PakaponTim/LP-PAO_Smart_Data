<!doctype html><html lang="th"><meta charset="utf-8"><title>เชื่อมต่อ Water System</title><style>body{font:16px system-ui;max-width:550px;margin:40px auto;padding:20px}input,button,label{display:block;width:100%;box-sizing:border-box;margin:12px 0;padding:8px}button{background:#1d4ed8;color:white;border:0;padding:12px}#status{white-space:pre-wrap}</style><h1>เชื่อมต่อ Water System</h1><p>ใช้บัญชีผู้ดูแลระบบเพื่อจับคู่ ส่วนขยายจะเก็บเฉพาะกุญแจอุปกรณ์และไม่เก็บรหัสผ่าน</p><form id="pair"><label>ที่อยู่เซิร์ฟเวอร์<input name="server" value="http://localhost:7000" required></label><label>ชื่อผู้ดูแล<input name="username" autocomplete="username" required></label><label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required></label><button>จับคู่อุปกรณ์</button></form><p id="status" role="status"></p><script src="options.js"></script></html>
