<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการบัญชี</title><script src="./auth-client.js"></script>
<style>body{font:16px system-ui;background:#f1f5f9;color:#172554;max-width:900px;margin:40px auto;padding:20px}section{background:white;border-radius:12px;padding:24px;margin:20px 0}input,select,button{padding:10px;margin:8px}li{padding:10px}button{cursor:pointer}#message{color:#b91c1c}</style>  <link rel="stylesheet" href="./css/ux-motion.css" />
  <script src="./js/ux-motion.js" defer></script>
</head><body><a href="./index.html">← Dashboard</a><h1>จัดการบัญชีและอุปกรณ์</h1><p id="message" role="status"></p>
<section><h2>เพิ่มผู้ใช้งาน</h2><form id="account"><input name="username" placeholder="ชื่อผู้ใช้" required minlength="3" maxlength="128"><input name="password" type="password" autocomplete="new-password" placeholder="รหัสผ่านอย่างน้อย 12 ตัว" required minlength="12" maxlength="256"><select name="role"><option value="viewer">ผู้ดูข้อมูล</option><option value="operator">เจ้าหน้าที่</option><option value="admin">ผู้ดูแลระบบ</option></select><button>เพิ่มบัญชี</button></form><ul id="users"></ul></section>
<section><h2>Extension ที่เชื่อมต่อ</h2><p>เปิดหน้าตัวเลือกของ Extension แล้วใช้บัญชีผู้ดูแลเพื่อจับคู่ อุปกรณ์ได้รับสิทธิ์ส่งข้อมูลเท่านั้น</p><ul id="devices"></ul></section><script src="./accounts.js"></script></body></html>
