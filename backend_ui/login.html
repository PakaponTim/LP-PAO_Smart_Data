<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ | Water System Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts: Inter & Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/login-1.css">
</head>
<body class="text-slate-200 antialiased selection:bg-blue-500 selection:text-white">

  <!-- Background Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Login Container -->
  <div class="w-full max-w-md px-6">
    <div class="glass-card rounded-2xl p-8 sm:p-10">
      
      <!-- Logo / Header -->
      <div class="text-center mb-8">
        <img src="logo_pao.png" class="w-20 h-20 object-contain mx-auto mb-4 select-none" alt="อบจ.ลำปาง Logo">
        <h1 class="text-2xl font-bold text-white tracking-tight">Water System</h1>
        <p class="text-slate-400 text-sm mt-2">ลงชื่อเข้าใช้เพื่อเข้าสู่ระบบศูนย์ข้อมูลน้ำ</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-5">
        
        <!-- Username Field -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5" for="username">บัญชีผู้ใช้ (Username)</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
              <i class="fa-solid fa-user text-slate-500"></i>
            </div>
            <input type="text" id="username" class="glass-input w-full rounded-xl pl-10 pr-4 py-3 text-sm focus:ring-0" placeholder="name@example.com" required autocomplete="username">
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-sm font-medium text-slate-300" for="password">รหัสผ่าน (Password)</label>
            <a href="#" class="text-xs font-medium text-blue-400 hover:text-blue-300 transition-colors">ลืมรหัสผ่าน?</a>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
              <i class="fa-solid fa-lock text-slate-500"></i>
            </div>
            <input type="password" id="password" class="glass-input w-full rounded-xl pl-10 pr-12 py-3 text-sm focus:ring-0" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 focus:outline-none transition-colors">
              <i class="fa-regular fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me -->
        <div class="flex items-center pt-2">
          <input type="checkbox" id="remember" checked class="w-4 h-4 rounded border-slate-600 bg-slate-800/50 text-blue-500 focus:ring-blue-500 focus:ring-offset-slate-900 cursor-pointer">
          <label for="remember" class="ml-2 block text-sm text-slate-300 cursor-pointer select-none">จดจำการเข้าสู่ระบบ (ต่ออายุ Session &amp; Cookie อัตโนมัติ 30 วัน)</label>
        </div>

        <!-- Error Message (Hidden by default) -->
        <div id="errorMessage" class="hidden text-red-400 text-sm text-center bg-red-500/10 border border-red-500/20 py-2 rounded-lg">
          ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง
        </div>

        <!-- Submit Button -->
        <div class="pt-4">
          <button type="submit" id="submitBtn" class="btn-glow w-full flex justify-center items-center gap-2 py-3.5 px-4 rounded-xl text-white font-medium text-sm focus:outline-none focus:ring-4 focus:ring-blue-500/30">
            <span id="btnText">เข้าสู่ระบบ</span>
            <div id="btnLoader" class="loader"></div>
          </button>
        </div>
      </form>
      
      <!-- Footer Info -->
      <div class="mt-8 text-center text-xs text-slate-500">
        <p>&copy; 2026 Water Management System.</p>
        <p>สงวนลิขสิทธิ์</p>
      </div>

    </div>
  </div>

  <script src="./js/login-1.js"></script>
</body>
</html>
