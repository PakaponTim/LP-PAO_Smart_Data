<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตั้งค่าผู้ดูแลระบบ</title>
<style>body{font:16px system-ui;background:#eef3f8;color:#172554;max-width:540px;margin:10vh auto;padding:24px}form{background:white;padding:28px;border-radius:16px}label,input,button{display:block;width:100%;box-sizing:border-box;margin:14px 0}input,button{padding:12px}button{background:#1d4ed8;color:white;border:0;border-radius:8px}#message{white-space:pre-wrap}</style>
<h1>ตั้งค่าผู้ดูแลระบบคนแรก</h1><p>ใช้ลิงก์ตั้งค่าที่แสดงในหน้าต่างเซิร์ฟเวอร์ ลิงก์ใช้ได้ครั้งเดียวและต้องเปิดบนเครื่องเซิร์ฟเวอร์</p>
<form id="setup"><label>อีเมลหรือชื่อผู้ใช้<input name="username" autocomplete="username" required minlength="3" maxlength="128"></label><label>รหัสผ่านอย่างน้อย 12 ตัวอักษร<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><label>ยืนยันรหัสผ่าน<input name="confirm" type="password" autocomplete="new-password" required></label><button>สร้างบัญชีผู้ดูแล</button><p id="message" role="status"></p></form>
<script src="./setup.js"></script></html>
